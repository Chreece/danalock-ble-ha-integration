name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pip cache service is GitHub-only; under `act` restore/save can
      # fail, so the cached step is skipped there and a plain setup runs.
      - uses: actions/setup-python@v5
        if: ${{ !env.ACT }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - uses: actions/setup-python@v5
        if: ${{ env.ACT }}
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
      - name: Run tests with coverage
        run: |
          pytest -m "not live" \
            --cov=custom_components/danalock_ble \
            --cov-report=term-missing \
            --cov-fail-under=95
      - name: Enforce per-module coverage above 95%
        run: |
          coverage json -o coverage.json
          python scripts/check_module_coverage.py coverage.json --min 95
